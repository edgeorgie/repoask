name: Release

# Tags main and publishes a GitHub release. Run it from the Actions tab after the
# release/<x.y.z> branch has been merged into main (GitFlow).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (must match package.json on main)
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Gate the release on the same checks CI runs. Without this, `release` only
  # verified that the version string matched package.json — a release could be
  # tagged and published from a tree that does not typecheck, lint, or pass
  # its tests, which is worse than having no release automation at all.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx next typegen
        if: ${{ hashFiles('next.config.*') != '' }}
      - run: npm run verify

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check the version matches package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "$VERSION" ]; then
            echo "package.json on main is $pkg, expected $VERSION" >&2
            exit 1
          fi
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --target main --title "v$VERSION" --generate-notes
